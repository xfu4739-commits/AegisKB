# Python rag-tools local configuration.
# Environment variables still take precedence over this file.

ragTools:
  documentParser:
    aliyunDocMind:
      endpoint: "${RAG_TOOLS_ALIYUN_DOCMIND_ENDPOINT:docmind-api.cn-hangzhou.aliyuncs.com}"
      accessKeyId: "${ALIBABA_CLOUD_ACCESS_KEY_ID:}"
      accessKeySecret: "${ALIBABA_CLOUD_ACCESS_KEY_SECRET:}"
      timeoutSeconds: 600
      pollIntervalSeconds: 3
      maxResultPages: 200
      llmEnhancement: true
      enhancementMode: "VLM"
      formulaEnhancement: true
      outputHtmlTable: true
      outputFormats: "markdown,visualLayoutInfo"
  llm:
    # OpenAI-compatible chat completions base URL.
    # DashScope example: https://dashscope.aliyuncs.com/compatible-mode/v1
    baseUrl: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    # Supports Spring-style environment placeholders, for example ${ALI_BAI_LIAN_API_KEY}.
    apiKey: "${ALI_BAI_LIAN_API_KEY}"
    # Example: qwen-plus-latest
    model: "qwen-plus-latest"
    timeoutSeconds: 30
  raptor:
    # Bounded per-level LLM summary concurrency for RAPTOR build. Environment variable RAG_TOOLS_RAPTOR_LLM_CONCURRENCY takes precedence.
    llmConcurrency: 3
  rerank:
    # Switchable scoring backend is chosen by env RAG_TOOLS_RERANK_BACKEND only:
    #   cross-encoder (default, local bge-reranker-base, zero egress) | jev (opt-in).
    # jev sends query + chunk text to the external TypeSafe System One API: this is NEW
    # data egress and requires explicit user authorization + an API key. No key => no
    # egress, fail-closed to the existing weighted-hybrid fallback. Never commit a literal key.
    jev:
      baseUrl: "https://api.typesafe.ai"
      apiKey: "${RAG_TOOLS_JEV_API_KEY:}"
      model: "jev-latest"
      timeoutSeconds: 30
      maxPassageChars: 4000
