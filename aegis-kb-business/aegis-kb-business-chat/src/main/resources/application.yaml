server:
  port: 9083
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
prefix:
  distinction:
    name: aegis-kb
spring:
  application:
    name: ${prefix.distinction.name:aegis-kb}-business-chat
  data:
    redis:
      database: 0
      host: 127.0.0.1
      port: 6379
      timeout: 3000  
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/aegis_kb?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: aegis-kb-hikari
      maximum-pool-size: 200
      minimum-idle: 100
  kafka:
    bootstrap-servers: 127.0.0.1:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      max-poll-records: 1
      properties:
        # 文档索引构建会触发 embedding、GraphRAG、RAPTOR 等长耗时任务。
        # Kafka listener 只负责提交后台任务，但这里仍显式放大 poll 间隔，避免本地调试或同步入口耗时接近默认 5 分钟时重复投递。
        max.poll.interval.ms: ${AEGIS_KB_KAFKA_MAX_POLL_INTERVAL_MS:1800000}
  ai:
    retry:
      # Spring AI 模型调用的统一重试策略。用于吸收 DashScope/OpenAI-compatible 网关偶发 EOF、连接重置、429/5xx 等瞬时失败。
      # 不重试 4xx 参数错误；业务侧仍会在最终失败时让构建任务失败并记录日志。
      max-attempts: ${AEGIS_KB_AI_RETRY_MAX_ATTEMPTS:4}
      backoff:
        initial-interval: ${AEGIS_KB_AI_RETRY_BACKOFF_INITIAL_INTERVAL:1500ms}
        multiplier: ${AEGIS_KB_AI_RETRY_BACKOFF_MULTIPLIER:2}
        max-interval: ${AEGIS_KB_AI_RETRY_BACKOFF_MAX_INTERVAL:8000ms}
    openai:
      # OpenAI 兼容协议的服务入口。
      # 当前这里接的是阿里云百炼 DashScope 的兼容地址，
      # chat 和 embedding 都会通过这个基地址发请求。
      base-url: https://dashscope.aliyuncs.com/compatible-mode/
      # OpenAI 兼容协议的访问密钥。
      # 正式环境建议改成环境变量注入，不要把真实密钥直接写在配置文件里。
      api-key: ${ALI_BAI_LIAN_API_KEY}
      chat:
        options:
          # 对话模型名称。
          model: qwen-plus-latest
          # 回答温度，数值越高结果越发散。
          temperature: 0.5
          # 单次回答允许输出的最大 token 数。
          maxTokens: 5000
      embedding:
        # embedding 单独指定 base-url，便于后续把对话模型和向量模型拆到不同网关时直接切换。
        base-url: https://dashscope.aliyuncs.com/compatible-mode/
        # embedding 调用使用的密钥。
        api-key: ${ALI_BAI_LIAN_API_KEY}
        options:
          # 向量模型名称。
          # 当前文档切块向量化时，会直接使用这里配置的模型，不再额外在 manage 下重复维护一份。
          model: text-embedding-v4
  main:
    allow-bean-definition-overriding: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
    servlet:
      load-on-startup: 1
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    local-cache-scope: statement  

app:
  admin-auth:
    username: ${AEGIS_KB_ADMIN_USERNAME:admin}
    password: ${AEGIS_KB_ADMIN_PASSWORD:admin123456}
    token-secret: ${AEGIS_KB_ADMIN_TOKEN_SECRET:aegis-kb-admin-token-secret-change-me}
    token-expire-minutes: ${AEGIS_KB_ADMIN_TOKEN_EXPIRE_MINUTES:720}
  preview-mode:
    enabled: ${AEGIS_KB_PREVIEW_MODE_ENABLED:false}
    message: ${AEGIS_KB_PREVIEW_MODE_MESSAGE:线上环境为只读展示模式，仅开放浏览与检索能力}
  rag-tools:
    # Python RAG 工具服务地址。
    # 当前 rerank 主链路已通过 RagRerankService 调用本服务；后续解析/OCR/表格等工具能力也会放在这里。
    base-url: ${AEGIS_KB_RAG_TOOLS_BASE_URL:http://127.0.0.1:18080}
    connect-timeout-ms: 3000
    read-timeout-ms: 10000
    document-parse-read-timeout-ms: ${AEGIS_KB_RAG_TOOLS_DOCUMENT_PARSE_READ_TIMEOUT_MS:600000}
    graph-extract-read-timeout-ms: ${AEGIS_KB_RAG_TOOLS_GRAPH_EXTRACT_READ_TIMEOUT_MS:30000}
    raptor-build-read-timeout-ms: ${AEGIS_KB_RAG_TOOLS_RAPTOR_BUILD_READ_TIMEOUT_MS:600000}
  # 会话、RAG、GraphRAG、RAPTOR、切块增强等业务参数由数据库系统配置统一管理。
  # 新环境先执行 sql/表数据/Mysql/init_system_config.sql；知识库只保存相对全局值的差异覆盖。
  tavily:
    # 是否启用 Tavily 联网搜索工具。
    # 关闭后，ReactAgent 即使判断需要搜索，也无法调用该工具。
    enabled: true
    # Tavily API 的服务地址。
    # 如果后续切换代理或企业网关，可以改这里。
    base-url: https://api.tavily.com
    # Tavily 搜索接口路径。
    # 默认使用官方的 /search 端点。
    search-path: /search
    # Tavily 的 API Key。
    # 推荐通过环境变量注入，避免把真实密钥写进配置文件。
    api-key: ${TAVILY_API_KEY}
    # 搜索主题类型。
    # Tavily 当前只接受 general、news、finance 三个枚举值。
    # 一般场景优先用 general。
    topic: general
    # 搜索深度。
    # advanced 会更重一些，但通常能拿到更完整的搜索结果。
    search-depth: advanced
    # 单次搜索最多返回多少条候选结果。
    # 结果越多，引用来源越全，但也会增加模型处理成本。
    max-results: 5
    # 是否让 Tavily 在结果中返回它生成的 answer 摘要。
    # 当前我们主要使用 results 里的来源信息，但 answer 也会被工具结果带回模型。
    include-answer: true
    # 是否返回网页原始全文内容。
    # 默认关闭，避免响应过大；如果后续需要做更深的抽取分析，可以再打开。
    include-raw-content: false

  manage:
    minio:
      # MinIO 服务地址。
      # 上传的原始文件和解析后的纯文本都会放在这里。
      # 本地一般是 9000 端口；如果你是 docker 启动的 MinIO，这里填宿主机映射地址。
      endpoint: http://127.0.0.1:9000
      # MinIO 访问账号。
      # 本地开发通常使用默认账号，生产环境建议改成专用 AK。
      access-key: minioadmin
      # MinIO 访问密码。
      # 生产环境不要直接写死在配置文件里，建议通过环境变量或配置中心下发。
      secret-key: minioadmin
      # 文档管理模块统一使用的 bucket 名称。
      # 应用启动时会自动检查这个 bucket 是否存在，不存在就自动创建。
      bucket-name: ${prefix.distinction.name:aegis-kb}-document
      # 原始文件对象前缀。
      # 最终对象路径一般会在这个前缀下再拼接文档 id 和文件名。
      object-prefix: rag/document
      # 解析后纯文本副产物对象前缀。
      # 当前解析主链路由 Python /document/parse 产出结构化 blocks；纯文本只作为解析产物和概要生成辅助，不再作为切块主输入。
      parsed-text-prefix: rag/parsed-text
      # 结构化解析产物对象前缀。
      # Python parser 后续生成的 Markdown、JSON、页面图片、表格图片、OCR JSON 都放在这个前缀下。
      parse-artifact-prefix: rag/parse-artifact
    kafka:
      # 文档上传后，异步执行“解析 + 策略推荐”的主题。
      parse-topic: aegis-kb-document-parse-route
      # 用户确认策略后，异步执行“切块 + 向量化 + 入库”的主题。
      index-topic: aegis-kb-document-index-build
      # Kafka 消费组名称。
      group-id: aegis-kb-document-manage
      # 本地开发时是否自动创建主题。
      # 如果线上 Kafka 不允许自动建 topic，可以改成 false，然后手动创建。
      auto-create-topics: true
    pgvector:
      # 是否启用 PGVector 向量写入。
      # 关闭后，向量化链路不会创建 PG 专用数据源。
      enabled: true
      # PostgreSQL 主机地址。
      host: 127.0.0.1
      # PostgreSQL 端口。
      port: 5432
      # PGVector 使用的数据库名。
      database: aegis_kb_pgvector
      # 默认 schema。
      schema: public
      # PostgreSQL 用户名。
      username: postgres
      # PostgreSQL 密码。
      password: postgres
      # 连接池名称，方便日志和监控定位。
      pool-name: aegis-kb-manage-pgvector-hikari
      # 连接池最大连接数。
      maximum-pool-size: 5
      # 连接池最小空闲连接数。
      minimum-idle: 1
    elasticsearch:
      # 是否启用 Elasticsearch 关键词检索。
      enabled: true
      # Elasticsearch 地址列表。
      uris:
        - http://127.0.0.1:9200
      # Elasticsearch 用户名。
      username: elastic
      # Elasticsearch 密码。
      password: ${ELASTICSEARCH_PASSWORD:elastic}
      # 关键词索引名称。
      index-name: ${prefix.distinction.name:aegis-kb}-document-keyword
      # 导航层结构节点索引名称，粒度是 section/step/list_item，不和 chunk 级关键词索引混用。
      navigation-index-name: ${prefix.distinction.name:aegis-kb}-document-navigation
      # 知识路由索引名称，粒度是 scope/topic/document 路由元数据，不和正文索引混用。
      route-index-name: ${prefix.distinction.name:aegis-kb}-knowledge-route
      # 建索引 analyzer。
      # 如果使用 IK analyzer，本地 Elasticsearch 必须安装 IK 插件；配置错误会直接启动失败。
      analyzer: ik_max_word
      # 搜索 analyzer。
      search-analyzer: ik_smart
      # 连接超时，毫秒。
      connect-timeout-millis: 3000
      # 读超时，毫秒。
      socket-timeout-millis: 5000
    neo4j:
      # 是否启用 Neo4j 结构图投影查询。MySQL 结构节点表始终是权威结构数据源；Neo4j 用于结构导航加速和图查询展示。
      enabled: true
      uri: bolt://127.0.0.1:7687
      username: neo4j
      password: ${NEO4J_PASSWORD:12345678}
      database: neo4j
      query-timeout-seconds: 5

logging:
  level:
    org.springframework.ai: DEBUG
    com.alibaba.cloud.ai: DEBUG
    org.aegiskb.ai.chatagent: INFO
    org.aegiskb.ai.manage: INFO

management:
  metrics:
    tags:
      application: aegis-kb
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: '*'
  health:
    elasticsearch:
      enabled: false
  prometheus:
    metrics:
      export:
        enabled: true
